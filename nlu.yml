version: "3.1"
nlu:
  - intent: order_status
    examples: |
      - Where is my order?
      - I haven't received my package yet.
      - Can you tell me the status of my order?
  - intent: cancel_order
    examples: |
      - I want to cancel my order.
      - Cancel my recent purchase.
      - Help me cancel this order.
  - intent: greetings
    examples: |
      - Hello!
      - Hi there!
      - Hey!
